[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Proxy API calls to the back-end.
# Replace https://your-backend.netlify.app with your actual back-end URL.
# If both front-end and back-end are on the same Netlify site, use relative path:
#   from = "/api/*"
#   to = "/.netlify/functions/api/:splat"
[[redirects]]
  from = "/api/*"
  to = "https://your-backend-url.netlify.app/.netlify/functions/api/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200