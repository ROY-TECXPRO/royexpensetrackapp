<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account - Expense Planner</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: -apple-system, system-ui, sans-serif; background: #f5f7fa; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; }
    .card { background: white; padding: 32px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 100%; max-width: 400px; }
    h2 { margin: 0 0 20px; color: #1f2937; font-size: 24px; }
    .form-group { margin-bottom: 16px; }
    label { display: block; margin-bottom: 6px; font-size: 14px; color: #374151; font-weight: 500; }
    input { width: 100%; padding: 10px 12px; border: 1px solid #d1d5db; border-radius: 6px; font-size: 14px; }
    input:focus { outline: none; border-color: #3b82f6; }
    button { width: 100%; padding: 10px; background: #3b82f6; color: white; border: none; border-radius: 6px; font-size: 16px; font-weight: 600; cursor: pointer; }
    button:hover:not(:disabled) { background: #2563eb; }
    button:disabled { background: #9ca3af; cursor: not-allowed; }
    .error { color: #ef4444; font-size: 14px; margin-bottom: 16px; padding: 10px; background: #fee2e2; border-radius: 6px; display: none; }
    .success { color: #10b981; font-size: 14px; margin-bottom: 16px; padding: 10px; background: #d1fae5; border-radius: 6px; display: none; }
    .divider { text-align: center; color: #6b7280; font-size: 14px; margin: 20px 0; position: relative; }
    .divider::before, .divider::after { content: ''; position: absolute; top: 50%; width: 40%; height: 1px; background: #e5e7eb; }
    .divider::before { left: 0; } .divider::after { right: 0; }
    a { color: #3b82f6; text-decoration: none; font-size: 14px; }
    a:hover { text-decoration: underline; }
    .text-center { text-align: center; }
    .mt-4 { margin-top: 16px; }
  </style>
</head>
<body>
  <div class="card">
    <h2>Create Account</h2>
    <div id="error" class="error"></div>
    <div id="success" class="success"></div>
    <form id="signupForm">
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required placeholder="you@example.com">
      </div>
      <div class="form-group">
        <label for="name">Full Name</label>
        <input type="text" id="name" name="name" required placeholder="Your name">
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" required minlength="6" placeholder="At least 6 characters">
      </div>
      <button type="submit" id="submitBtn">Create Account</button>
    </form>
    <div class="divider">Or use Supabase Auth directly</div>
    <p class="text-center mt-4">Already have an account? <a href="login.html">Sign in</a></p>
  </div>

  <script>
    // ============================================================
    // CONFIGURATION - Update BACKEND_URL for your deployment
    // ============================================================
    // Option A: Back-end on Netlify Functions (same domain)
    const BACKEND_URL = window.location.origin;
    const API_REGISTER = `${BACKEND_URL}/api/auth/register`;

    // Option B: Back-end deployed separately (e.g. Render, Railway)
    // const BACKEND_URL = 'https://your-backend-url.com';
    // const API_REGISTER = `${BACKEND_URL}/api/auth/register`;

    const form = document.getElementById('signupForm');
    const errorEl = document.getElementById('error');
    const successEl = document.getElementById('success');
    const submitBtn = document.getElementById('submitBtn');

    function showError(msg) {
      errorEl.textContent = msg;
      errorEl.style.display = 'block';
      successEl.style.display = 'none';
    }

    function showSuccess(msg) {
      successEl.textContent = msg;
      successEl.style.display = 'block';
      errorEl.style.display = 'none';
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorEl.style.display = 'none';
      successEl.style.display = 'none';

      const email = document.getElementById('email').value.trim();
      const name = document.getElementById('name').value.trim();
      const password = document.getElementById('password').value;

      if (!email || !password || !name) {
        showError('Please fill in all fields.');
        return;
      }
      if (password.length < 6) {
        showError('Password must be at least 6 characters.');
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = 'Creating account...';

      try {
        const response = await fetch(API_REGISTER, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password, name }),
        });

        const data = await response.json();

        if (!response.ok) {
          showError(data.error || 'Failed to create account.');
          return;
        }

        showSuccess('Account created successfully! You can now sign in.');
        form.reset();
        setTimeout(() => { window.location.href = 'login.html'; }, 1500);

      } catch (err) {
        console.error('Signup error:', err);
        showError('Network error. Please check your connection.');
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Create Account';
      }
    });
  </script>
</body>
</html>
